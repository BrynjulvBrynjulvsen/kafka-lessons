server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}

spring:
  application:
    name: kafka-demo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_GROUP_ID:kafka-demo}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: batch
      missing-topics-fatal: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

demo:
  topics: ${KAFKA_TOPICS:kafka-demo,kafka-demo-lab}
  default-topic: ${KAFKA_DEFAULT_TOPIC:kafka-demo}
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}

  experiment:
    enabled: ${DEMO_EXPERIMENT_ENABLED:true}
    topic: ${DEMO_EXPERIMENT_TOPIC:kafka-demo-lab}
    group-prefix: ${DEMO_EXPERIMENT_GROUP_PREFIX:kafka-demo-experiment}
