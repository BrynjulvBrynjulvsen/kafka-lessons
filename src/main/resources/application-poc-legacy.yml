# Lesson deck against the POC's direct legacy listener. Do not combine with migration.
spring:
  config:
    import: "file:${KAFKA_CLIENT_PROPERTIES}"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:32095}
    consumer:
      group-id: ${KAFKA_GROUP_ID:kafka-demo-poc-observer}
    properties:
      "[security.protocol]": SASL_PLAINTEXT
      "[sasl.mechanism]": SCRAM-SHA-512
      "[sasl.jaas.config]": ${sasl.jaas.config}

demo:
  experiment:
    group-prefix: ${DEMO_EXPERIMENT_GROUP_PREFIX:kafka-demo-poc-experiment}
